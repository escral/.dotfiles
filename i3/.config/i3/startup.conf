# ── i3wm Startup Configuration ───────────────────────────────────────────────
exec_always --no-startup-id picom
exec_always --no-startup-id ibus exit
exec_always --no-startup-id autorandr --change
exec_always --no-startup-id nitrogen --restore
exec_always --no-startup-id numlockx on
exec_always --no-startup-id xset r rate 400
exec_always --no-startup-id setxkbmap -layout us,ru -option "grp:alt_shift_toggle,caps:escape"

# ── Lock screen ──────────────────────────────────────────────────────────────
# exec --no-startup-id i3lock --color 000000

# ── Set keyboard layout ──────────────────────────────────────────────────────

# ── Kitty fast-open preload ──────────────────────────────────────────────────
exec --no-startup-id kitty-preload

# ── Run once on login ────────────────────────────────────────────────────────
exec --no-startup-id dunst
exec --no-startup-id /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1
exec --no-startup-id volumeicon
exec --no-startup-id telegram-desktop
exec --no-startup-id slack
