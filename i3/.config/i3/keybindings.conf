# ── Applications ─────────────────────────────────────────────────────────────
# @action group:apps title:Open terminal
bindsym $mod+Return       exec --no-startup-id kitty-fast
# @action group:apps title:Open project in Neovim
bindsym $mod+Shift+Return exec --no-startup-id kitty -1 --class nvim -e /home/alexander/.dotfiles/bin/.local/scripts/open-project-nvim-fzm
# @action group:apps title:Open Chrome
bindsym $mod+c            exec --no-startup-id google-chrome
# @action group:apps title:App launcher
bindsym $mod+d            exec --no-startup-id rofi -show drun -run-shell-command '{terminal} -e zsh -ic "{cmd} && read"'
# @action group:apps title:Window switcher
bindsym $mod+Tab          exec --no-startup-id rofi -show window
# @action group:apps title:Open project in IDE
bindsym $mod+p            exec --no-startup-id $HOME/.local/scripts/open-project-ide
# @action group:apps title:Action launcher
bindsym $mod+Shift+p      exec --no-startup-id $HOME/.local/scripts/action-selector

# ── Window focus ─────────────────────────────────────────────────────────────
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+Left  focus left
bindsym $mod+Down  focus down
bindsym $mod+Up    focus up
bindsym $mod+Right focus right
bindsym $mod+a     focus parent

# ── Window movement ───────────────────────────────────────────────────────────
bindsym $mod+Shift+Left  move left
bindsym $mod+Shift+Down  move down
bindsym $mod+Shift+Up    move up
bindsym $mod+Shift+Right move right

# ── Layout ────────────────────────────────────────────────────────────────────
# @action group:layout title:Split horizontally
bindsym $mod+z           split h
# @action group:layout title:Split vertically
bindsym $mod+v           split v
# @action group:layout title:Toggle fullscreen
bindsym $mod+f           fullscreen toggle
# @action group:layout title:Tabbed layout
bindsym $mod+w           layout tabbed
# @action group:layout title:Split layout
bindsym $mod+e           layout splith
# @action group:layout title:Toggle floating
bindsym $mod+Shift+space floating toggle
bindsym $mod+plus        floating toggle

# ── Scratchpad ────────────────────────────────────────────────────────────────
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus       scratchpad show

# ── Workspaces ────────────────────────────────────────────────────────────────
bindsym $mod+1 workspace $wsMainCode
bindsym $mod+2 workspace $wsAIAgent
bindsym $mod+3 workspace $wsTerminals
bindsym $mod+4 workspace 4
bindsym $mod+5 workspace 5
bindsym $mod+6 workspace 6
bindsym $mod+7 workspace 7
bindsym $mod+8 workspace 8
bindsym $mod+9 workspace $wsBrowser
bindsym $mod+grave workspace $wsBrowser
bindsym $mod+0 workspace $wsMessagers

bindsym Mod1+Tab workspace back_and_forth

bindsym $mod+Shift+1 move container to workspace $wsMainCode
bindsym $mod+Shift+2 move container to workspace $wsAIAgent
bindsym $mod+Shift+3 move container to workspace $wsTerminals
bindsym $mod+Shift+4 move container to workspace 4
bindsym $mod+Shift+5 move container to workspace 5
bindsym $mod+Shift+6 move container to workspace 6
bindsym $mod+Shift+7 move container to workspace 7
bindsym $mod+Shift+8 move container to workspace 8
bindsym $mod+Shift+9 move container to workspace $wsBrowser
bindsym $mod+Shift+grave move container to workspace $wsBrowser
bindsym $mod+Shift+0 move container to workspace $wsMessagers

# ── i3 control ────────────────────────────────────────────────────────────────
# @action group:i3 title:Kill focused window
bindsym $mod+Shift+q kill
# @action group:i3 title:Reload i3 config
bindsym $mod+Shift+c reload
# @action group:i3 title:Restart i3
bindsym $mod+Shift+r restart
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -b 'Yes, exit i3' 'i3-msg exit'"
# @action group:i3 title:Lock screen
bindsym $mod+Shift+l exec --no-startup-id i3lock --color 000000
# @action group:i3 title:Toggle i3bar visibility
bindsym $mod+b       bar mode toggle
# @action group:i3 title:Enter resize mode
bindsym $mod+r       mode "resize"

mode "resize" {
    bindsym h      resize shrink width  10 px or 10 ppt
    bindsym j      resize grow   height 10 px or 10 ppt
    bindsym k      resize shrink height 10 px or 10 ppt
    bindsym l      resize grow   width  10 px or 10 ppt
    bindsym Left   resize shrink width  10 px or 10 ppt
    bindsym Down   resize grow   height 10 px or 10 ppt
    bindsym Up     resize shrink height 10 px or 10 ppt
    bindsym Right  resize grow   width  10 px or 10 ppt
    bindsym Return mode "default"
    bindsym Escape mode "default"
}

# ── Media ─────────────────────────────────────────────────────────────────────
# @action group:volume title:Volume up
bindsym XF86AudioRaiseVolume exec "amixer -q sset Master,0 5+ unmute"
# @action group:volume title:Volume down
bindsym XF86AudioLowerVolume exec "amixer -q sset Master,0 5- unmute"
# @action group:volume title:Toggle mute
bindsym XF86AudioMute        exec "amixer -q sset Master,0 toggle"

# ── Screenshots (saved to clipboard) ─────────────────────────────────────────
# @action group:print title:Screenshot selection to clipboard
bindsym Print       exec --no-startup-id maim --select | xclip -selection clipboard -t image/png
# @action group:print title:Screenshot focused window to clipboard
bindsym $mod+Print  exec --no-startup-id maim --window $(xdotool getactivewindow) | xclip -selection clipboard -t image/png
# @action group:print title:Screenshot full screen to clipboard
bindsym Shift+Print exec --no-startup-id maim | xclip -selection clipboard -t image/png

# Fallback to F12
bindsym Shift+F12       exec --no-startup-id maim --select | xclip -selection clipboard -t image/png

# ── Input ─────────────────────────────────────────────────────────────────────
# @action group:input title:Reset keyboard layout
bindsym Mod1+F1 exec --no-startup-id setxkbmap -layout us,ru -option "grp:alt_shift_toggle,caps:escape"
