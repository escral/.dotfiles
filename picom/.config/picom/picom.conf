backend = "glx";
vsync = true;

# Opacity
# inactive-opacity = 0.97;
# active-opacity = 1.0;
# frame-opacity = 1.0;

# Fast fading
fading = true;
fade-in-step = 0.20;
fade-out-step = 0.20;
fade-delta = 3;

# Corners
# corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Shadows
shadow = false;
shadow-radius = 12;
shadow-opacity = 0.18;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3-frame'"
];

# No blur for speed
# blur-method = "dual_kawase";
# blur-strength = 5;

opacity-rule = [
  "100:class_g = 'Rofi'"
];
